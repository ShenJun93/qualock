[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qualock"
version = "0.1.0"
description = "Lock in known-good coding-agent behavior before you upgrade"
readme = "README.md"
keywords = ["ai-agents", "coding-agents", "codex", "regression-testing", "devtools", "ci"]
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "pydantic>=2",
  "typer>=0.12",
  "rich>=13",
  "PyYAML>=6",
  "httpx>=0.27",
  "platformdirs>=4",
  "packaging>=24",
]


[project.urls]
Repository = "https://github.com/ShenJun93/qualock"
Issues = "https://github.com/ShenJun93/qualock/issues"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
qualock = "qualock.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["qualock"]
mypy_path = "src"
