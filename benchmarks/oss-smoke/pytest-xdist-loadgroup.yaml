schema_version: 1
id: pytest-xdist-loadgroup-crash-recovery
name: pytest-xdist loadgroup crash recovery
repository:
  url: https://github.com/pytest-dev/pytest-xdist.git
  base_sha: dd198c35710f22b1cb86b7fc00311f9b7c63d665
runtime:
  image: ghcr.io/astral-sh/uv:0.9.30-python3.12-bookworm@sha256:85d4cb1afa769a7338e095b927bee941cf5ec92266c7424b3f6c0f2748567248
task: |
  When loadscope/loadgroup scheduling replaces a crashed worker after some
  items in its assigned workload have already completed, the replacement can
  receive work with no pending items and the test run can stall.

  Fix crash recovery so only unfinished work is rescheduled and scheduling
  never dispatches an empty work unit.

  Do not modify tests.
setup:
  - uv pip install --system -e .
agent:
  timeout_seconds: 600
grader:
  patch: graders/pytest-xdist-loadgroup.patch
  command:
    - python -m pytest .qualock-grader/test_regression.py -q
constraints:
  protected_paths:
    - testing/**
    - pyproject.toml
critical: true
