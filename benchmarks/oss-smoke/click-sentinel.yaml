schema_version: 1
id: click-sentinel-duplication
name: Click sentinel copy deepcopy pickle
repository:
  url: https://github.com/pallets/click.git
  base_sha: 3cbcf9b11546f4cf10b36d3e2e531733ba6fe001
runtime:
  image: ghcr.io/astral-sh/uv:0.10.0-python3.12-bookworm-slim
task: |
  Click parameters using sentinel defaults cannot reliably be copied,
  deep-copied, or round-tripped through pickle.

  Fix this while preserving sentinel singleton identity and normal parameter
  behavior.

  Do not modify tests.
setup:
  - uv sync --frozen --no-default-groups --group tests
agent:
  timeout_seconds: 600
grader:
  patch: graders/click-sentinel.patch
  command:
    - uv run pytest .qualock-grader/test_regression.py -q
constraints:
  protected_paths:
    - tests/**
    - pyproject.toml
    - uv.lock
critical: true
